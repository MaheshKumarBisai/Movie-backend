name: Deploy Backend (Docker)

on:
  push:
    branches: [f/deploy, main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to EC2 via Docker
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH & Run Docker
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST || vars.EC2_HOST }}
          username: ${{ secrets.EC2_USER || vars.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Exit immediately if a command exits with a non-zero status
            set -e

            # 1. Find or clone repository on EC2
            if [ -d "/home/ubuntu/Movie-backend" ]; then
              cd /home/ubuntu/Movie-backend
            elif [ -d "/home/ubuntu/Two-heartes" ]; then
              cd /home/ubuntu/Two-heartes
            else
              echo "Cloning repository..."
              cd /home/ubuntu
              git clone https://github.com/MaheshKumarBisai/Movie-backend.git
              cd Movie-backend
            fi

            # 2. Fetch and checkout the exact branch being pushed (${{ github.ref_name }})
            echo "Checking out branch: ${{ github.ref_name }}"
            git fetch origin ${{ github.ref_name }}
            git checkout ${{ github.ref_name }}
            git pull origin ${{ github.ref_name }}

            # 3. Create shared docker network if not exists
            docker network create movie-net 2>/dev/null || true

            # 4. Ensure Redis container is running on the network
            if ! docker ps --format '{{.Names}}' | grep -q "^movie-redis$"; then
              echo "Starting Redis container..."
              docker run -d \
                --name movie-redis \
                --network movie-net \
                --restart unless-stopped \
                -p 6379:6379 \
                redis:7-alpine
            else
              # Make sure redis is connected to movie-net
              docker network connect movie-net movie-redis 2>/dev/null || true
            fi

            # 5. Build Docker image
            echo "Building movie-backend image..."
            docker build -t movie-backend .

            # 6. Stop and remove existing backend container if running
            docker stop movie-backend 2>/dev/null || true
            docker rm movie-backend 2>/dev/null || true

            # 7. Run container with environment variables passed directly in-memory
            # (NO .env file is saved to EC2 disk)
            echo "Running movie-backend container..."
            docker run -d \
              --name movie-backend \
              --network movie-net \
              --restart unless-stopped \
              -p 8000:8000 \
              -e APP_NAME="${{ vars.APP_NAME || 'Movie Ticket Backend' }}" \
              -e DEBUG="${{ vars.DEBUG || 'False' }}" \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e REDIS_URL="${{ vars.REDIS_URL || secrets.REDIS_URL || 'redis://movie-redis:6379/0' }}" \
              -e JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}" \
              -e JWT_ALGORITHM="HS256" \
              -e JWT_EXPIRE_MINUTES="${{ vars.JWT_EXPIRE_MINUTES || '525600' }}" \
              -e OTP_EXPIRE_SECONDS="${{ vars.OTP_EXPIRE_SECONDS || '300' }}" \
              -e SEAT_LOCK_TTL="${{ vars.SEAT_LOCK_TTL || '600' }}" \
              -e AWS_ACCESS_KEY_ID="${{ secrets.AWS_ACCESS_KEY_ID }}" \
              -e AWS_SECRET_ACCESS_KEY="${{ secrets.AWS_SECRET_ACCESS_KEY }}" \
              -e AWS_S3_BUCKET="${{ vars.AWS_S3_BUCKET || secrets.AWS_S3_BUCKET }}" \
              -e AWS_REGION="${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-2' }}" \
              -e SMTP_HOST="${{ vars.SMTP_HOST || 'smtp.gmail.com' }}" \
              -e SMTP_PORT="${{ vars.SMTP_PORT || '587' }}" \
              -e SMTP_USER="${{ secrets.SMTP_USER }}" \
              -e SMTP_PASS="${{ secrets.SMTP_PASS }}" \
              -e SMTP_FROM="${{ vars.SMTP_FROM || secrets.SMTP_FROM || 'noreply@showgo.com' }}" \
              movie-backend

            # 8. Clean up dangling images
            docker image prune -f

            # 9. Verify container is running
            docker ps --filter "name=movie-backend"
            echo "ShowGo Backend successfully deployed with Docker!"
